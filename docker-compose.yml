version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wisewords-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/shared/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  ollama:
    image: ollama/ollama:latest
    container_name: wisewords-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  wisewords-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wisewords-engine
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - WISE_WORDS_CONFIG=/app/config.json
    depends_on:
      - postgres
      - ollama

volumes:
  pgdata:
  ollama_data:
